name: Approvals and publishing

on:
  # Main trigger: cron-job.org calls workflow_dispatch every 15 minutes inside the
  # New York posting windows. This hourly schedule is only a backup (GitHub often skips it).
  schedule:
    - cron: '7 0,1,11,12,13,15,16,17,21,22,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Safety net for the bot (pending link previews and actions)
        run: node src/linkpreview.js && node src/apply-actions.js
      - run: node src/poll.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/mahiruyan/neurafeed-media/main
          PUBLIC_VIDEO_BASE: https://mahiruyan.github.io/neurafeed-media
      - name: Save state
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add state inbox jobs
          git diff --cached --quiet || git commit -m "pipeline: approvals [skip ci]"
          git pull --rebase --autostash origin main
          git push
