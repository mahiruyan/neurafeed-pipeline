name: Bot approve or reject

# Called by the Telegram bot when Mahir taps Approve / Reject on a sensitive story.
on:
  workflow_dispatch:
    inputs:
      id: { description: Job id, required: true }
      action: { description: ok or no, required: true }

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Record decision
        env:
          ID: ${{ inputs.id }}
          ACTION: ${{ inputs.action }}
        run: |
          node -e "
          const {getJobState,setJobState}=require('./src/state');
          const id=process.env.ID; const st=getJobState(id);
          if(!st||st.status!=='pending'){console.log('not pending:',st&&st.status);process.exit(0)}
          setJobState(id, process.env.ACTION==='ok'?{status:'approved',by:'mahir'}:{status:'rejected',by:'mahir'});"
      - name: Publish now if it is a posting window
        run: node src/poll.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/mahiruyan/neurafeed-media/main
          PUBLIC_VIDEO_BASE: https://mahiruyan.github.io/neurafeed-media
      - name: Save
        if: always()
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "pipeline: decision from Telegram [skip ci]"
          git pull --rebase --autostash origin main
          git push
