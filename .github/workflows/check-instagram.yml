name: Check Instagram connection

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Instagram who this token belongs to
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::IG_USER_ID or IG_ACCESS_TOKEN secret is missing"; exit 1
          fi
          me=$(curl -s "https://graph.instagram.com/me?fields=user_id,username,account_type&access_token=$IG_ACCESS_TOKEN")
          echo "::notice::me: $(echo "$me" | jq -c .)"
          if echo "$me" | jq -e '.error' > /dev/null; then
            echo "::error::Token rejected: $(echo "$me" | jq -r '.error.message')"; exit 1
          fi
          tid=$(echo "$me" | jq -r '.user_id // empty')
          if [ -n "$tid" ] && [ "$tid" != "$IG_USER_ID" ]; then
            echo "::warning::IG_USER_ID secret does not match the token's user_id. Expected $tid"
          fi
          limit=$(curl -s "https://graph.instagram.com/$IG_USER_ID/content_publishing_limit?fields=quota_usage,config&access_token=$IG_ACCESS_TOKEN")
          echo "::notice::quota: $(echo "$limit" | jq -c .)"
          acct=$(curl -s "https://graph.instagram.com/$IG_USER_ID?fields=followers_count,media_count&access_token=$IG_ACCESS_TOKEN")
          echo "::notice::account: $(echo "$acct" | jq -c 'del(.id)')"
          ins=$(curl -s "https://graph.instagram.com/$IG_USER_ID/insights?metric=reach,follower_count&period=day&access_token=$IG_ACCESS_TOKEN")
          echo "::notice::account insights: $(echo "$ins" | jq -c '.error.message // ([.data[]?.name])')"
          demo=$(curl -s "https://graph.instagram.com/$IG_USER_ID/insights?metric=follower_demographics&period=lifetime&metric_type=total_value&breakdown=country&access_token=$IG_ACCESS_TOKEN")
          echo "::notice::demographics: $(echo "$demo" | jq -c '.error.message // ([.data[]?.name])')"
          mid=$(curl -s "https://graph.instagram.com/$IG_USER_ID/media?fields=id&limit=1&access_token=$IG_ACCESS_TOKEN" | jq -r '.data[0].id')
          mi=$(curl -s "https://graph.instagram.com/$mid/insights?metric=reach,views,saved,shares&access_token=$IG_ACCESS_TOKEN")
          echo "::notice::media insights: $(echo "$mi" | jq -c '.error.message // ([.data[]? | {(.name): .values[0].value}] | add)')"
          for m in engaged_audience_demographics reached_audience_demographics; do
            for tf in this_week this_month last_30_days; do
              r=$(curl -s "https://graph.instagram.com/$IG_USER_ID/insights?metric=$m&period=lifetime&timeframe=$tf&metric_type=total_value&breakdown=country&access_token=$IG_ACCESS_TOKEN")
              echo "::notice::$m $tf: $(echo "$r" | jq -c '.error.message // [.data[0].total_value.breakdowns[0].results[:3][] | {(.dimension_values[0]): .value}]')"
            done
          done
          echo "OK"
      - name: Many posts with insights in one call
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          fe=$(curl -s -G "https://graph.instagram.com/$IG_USER_ID/media" --data-urlencode "fields=id,timestamp,like_count,insights.metric(reach,views,saved,shares,total_interactions)" -d limit=100 -d "access_token=$IG_ACCESS_TOKEN")
          echo "::notice::field expansion: $(echo "$fe" | jq -c '.error.message // {n: (.data|length), first: .data[0].insights.data, last_time: .data[-1].timestamp, next: (.paging.next != null)}' | cut -c1-600)"
      - name: Telegram webhook health
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          w=$(curl -s "https://api.telegram.org/bot$T/getWebhookInfo")
          echo "::notice::webhook: $(echo "$w" | jq -c '.result | {pending_update_count, last_error_date, last_error_message, max_connections}')"
      - name: Facebook page token
        env:
          FB: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          me=$(curl -s "https://graph.facebook.com/v23.0/me?fields=id,name&access_token=$FB")
          echo "::notice::fb me: $(echo "$me" | jq -c '.error.message // {name}')"
          acc=$(curl -s "https://graph.facebook.com/v23.0/me/accounts?fields=id,name,tasks&access_token=$FB")
          echo "::notice::fb pages: $(echo "$acc" | jq -c '.error.message // [.data[] | {id, name, tasks}]')"
          dbg=$(curl -s "https://graph.facebook.com/v23.0/debug_token?input_token=$FB&access_token=$FB")
          echo "::notice::fb token: $(echo "$dbg" | jq -c '.error.message // (.data | {type, expires_at, scopes})')"
