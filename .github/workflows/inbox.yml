name: Bot link to inbox

# Called by the Telegram bot (Cloudflare Worker) when Mahir sends a link.
on:
  workflow_dispatch:
    inputs:
      text: { description: Message text, required: true }
      extra_urls: { description: Hidden link URLs, required: false, default: '' }
      message_id: { description: Telegram message id, required: true }
      date: { description: Telegram unix date, required: true }

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add link
        env:
          TEXT: ${{ inputs.text }}
          EXTRA: ${{ inputs.extra_urls }}
          MID: ${{ inputs.message_id }}
          DATE: ${{ inputs.date }}
        run: node -e "const a=require('./src/inbox').addFromMessage(process.env.TEXT,(process.env.EXTRA||'').split(' ').filter(Boolean),process.env.MID,Number(process.env.DATE));console.log(JSON.stringify(a))"
      - name: Read what the link shows (caption, cover image)
        run: node src/linkpreview.js
      - name: Save
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add inbox
          git diff --cached --quiet || git commit -m "inbox: link from Telegram [skip ci]"
          git pull --rebase --autostash origin main
          git push
