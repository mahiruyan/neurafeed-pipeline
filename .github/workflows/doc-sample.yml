name: Documentary sample

# Renders the 30-second documentary sample in two styles (dark, light) plus two thumbnails,
# with the narration from ElevenLabs, and pushes the results to the `doc-sample` branch.
on:
  workflow_dispatch:
    inputs:
      walkout: { description: Opening scene image URL, required: true }
      thumb_a: { description: Thumbnail A image URL, required: true }
      thumb_b: { description: Thumbnail B image URL, required: true }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1
      - run: npm install --no-audit --no-fund
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node video/sample/tts.js video/sample/script.json build
      - name: Render dark
        run: node video/sample/render.js build dark "${{ inputs.walkout }}" build/sample-dark.mp4
      - name: Render light
        run: node video/sample/render.js build light "${{ inputs.walkout }}" build/sample-light.mp4
      - name: Thumbnails
        run: |
          node video/sample/thumb.js a "${{ inputs.thumb_a }}" build/thumb-a.jpg
          node video/sample/thumb.js b "${{ inputs.thumb_b }}" build/thumb-b.jpg
      - name: Push to doc-sample branch
        run: |
          mkdir -p /tmp/out && cp build/*.mp4 build/*.jpg build/voice.mp3 build/timing.json /tmp/out/
          git config user.name "neurafeed-bot"; git config user.email "bot@neurafeed.ai"
          git checkout --orphan doc-sample && git rm -rqf --cached . && rm -rf sample && mkdir sample && cp /tmp/out/* sample/
          git add -f sample && git commit -qm "documentary sample" && git push -f origin doc-sample
