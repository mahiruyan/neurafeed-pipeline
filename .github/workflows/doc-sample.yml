name: Documentary sample

# Renders the documentary sample with Remotion: narration (ElevenLabs), real article screenshots,
# real photos, then two thumbnails. Results go to the `doc-sample` branch.
on:
  workflow_dispatch:
    inputs:
      walkout: { description: Opening scene image URL, required: true }
      thumb_a: { description: Thumbnail A image URL, required: false, default: '' }
      thumb_b: { description: Thumbnail B image URL, required: false, default: '' }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1
      - run: npm install --no-audit --no-fund
      - run: mkdir -p build && cd video/doc && npm install --no-audit --no-fund
      - name: Narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node video/sample/tts.js video/sample/script.json video/doc/public/assets
      - name: Real material (article screenshots, photos)
        run: |
          node video/doc/capture.js
          curl -sL -A "Mozilla/5.0" -o video/doc/public/assets/walkout.jpg "${{ inputs.walkout }}"
          node video/doc/props.js
      - name: Render
        run: |
          cd video/doc
          npx remotion render src/index.ts Doc ../../build/sample.mp4 --props=props.json --crf=18
          for f in 60 200 260 400 480 600; do npx remotion still src/index.ts Doc ../../build/still-$f.jpg --frame=$f --props=props.json --image-format=jpeg --log=error || true; done
      - name: Thumbnails
        if: inputs.thumb_a != ''
        run: |
          node video/sample/thumb.js a "${{ inputs.thumb_a }}" build/thumb-a.jpg
          node video/sample/thumb.js b "${{ inputs.thumb_b }}" build/thumb-b.jpg
      - name: Push to doc-sample branch
        run: |
          mkdir -p /tmp/out && cp build/* video/doc/public/assets/*.png video/doc/public/assets/*.json video/doc/public/assets/dario.jpg /tmp/out/ 2>/dev/null || true
          git config user.name "neurafeed-bot"; git config user.email "bot@neurafeed.ai"
          git checkout --orphan doc-sample && git rm -rqf --cached . && rm -rf sample && mkdir sample && cp /tmp/out/* sample/
          git add -f sample && git commit -qm "documentary sample" && git push -f origin doc-sample
