name: Hero backfill

# One-off: website hero images for desk-feed stories rendered before heroes existed,
# then republish the media and the desk feed.
on:
  workflow_dispatch:

concurrency:
  group: pipeline-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node src/hero-backfill.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Publish heroes and the desk feed
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://mahiruyan:${MEDIA_REPO_TOKEN}@github.com/mahiruyan/neurafeed-media.git" media
          for d in out/*/; do id=$(basename "$d"); [ -f "$d/hero.jpg" ] || continue; mkdir -p "media/$id"; cp "$d/hero.jpg" "media/$id/"; done
          node src/deskfeed.js media/feed/desk.xml
          cd media && git config user.name "neurafeed-bot" && git config user.email "neurafeed-bot@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || (git commit -qm "heroes and desk feed" && git push -q))
      - name: Save hero metadata
        run: |
          git config user.name "neurafeed-bot" && git config user.email "neurafeed-bot@users.noreply.github.com"
          git add out/*/hero.json out/*/hero.jpg 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "out: website heroes [skip ci]" && (git push -q || (git pull -q --rebase && git push -q)))
