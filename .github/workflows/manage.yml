name: Bot manage a post

# Called by the Telegram bot after Mahir confirms an action (cancel, post now, reschedule...).
on:
  workflow_dispatch:
    inputs:
      action: { description: cancel, post_now, reschedule, priority, approve, reject, required: true }
      id: { description: Job id, required: true }
      value: { description: New time (ISO) or priority, required: false, default: '' }

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/manage.js "${{ inputs.action }}" "${{ inputs.id }}" "${{ inputs.value }}"
      - name: Publish if something is due now
        run: node src/poll.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/mahiruyan/neurafeed-media/main
          PUBLIC_VIDEO_BASE: https://mahiruyan.github.io/neurafeed-media
      - name: Save
        if: always()
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add state jobs
          git diff --cached --quiet || git commit -m "pipeline: ${{ inputs.action }} ${{ inputs.id }} from Telegram [skip ci]"
          git pull --rebase --autostash origin main
          git push
