name: Top media

on:
  workflow_dispatch:
    inputs:
      max: { description: 'How many posts to read', required: false, default: '400' }

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/top-media.js "${{ inputs.max }}"
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
