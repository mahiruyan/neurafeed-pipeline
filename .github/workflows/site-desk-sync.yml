name: Site desk sync

# Every hour: the website scans its approved feeds and turns the news desk's new articles into
# drafts (up to 4 per run). Each draft still waits for Mahir's approval on Telegram.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      max: { description: drafts per run (1 to 8), required: false, default: '4' }

concurrency:
  group: site-desk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          T: ${{ secrets.SITE_REVIEW_TOKEN }}
        run: |
          max="${{ inputs.max }}"; [ -n "$max" ] || max=4
          r=$(curl -s -m 280 -w '\n%{http_code}' -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "{\"action\":\"desk_sync\",\"max\":$max}" https://admin.neurafeedai.com/api/jobs/telegram-review)
          code=$(tail -1 <<<"$r"); body=$(sed '$d' <<<"$r")
          echo "::notice::HTTP $code scan=$(jq -c '.scan' <<<"$body" 2>/dev/null) scanError=$(jq -r '.scanError // ""' <<<"$body" 2>/dev/null | cut -c1-200)"
          jq -r '.drafted[]? | "drafted: \(.headline)"' <<<"$body" 2>/dev/null | while read -r l; do echo "::notice::$l"; done
          jq -r '.errors[]?' <<<"$body" 2>/dev/null | head -5 | while read -r l; do echo "::warning::$l"; done
          echo "::notice::waiting for a later run: $(jq -r '.waiting // 0' <<<"$body" 2>/dev/null)"
          [ "$code" = 200 ] || { echo "::error::$(cut -c1-300 <<<"$body")"; exit 1; }
