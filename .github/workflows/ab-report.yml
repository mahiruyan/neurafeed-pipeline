name: Cover A/B report

# Compares the cover test variants (tools/abtest.js) on Instagram views. Weekly on Mondays, or by hand.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      days: { description: 'Number of days', required: false, default: '30' }
      send: { description: 'Send to Telegram', required: false, default: 'true' }

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/ab-report.js "${{ inputs.days || '30' }}"
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND: ${{ inputs.send || 'true' }}
