name: Bot memory

# Called by the Telegram bot after Mahir confirms a memory change.
on:
  workflow_dispatch:
    inputs:
      op: { description: add, replace, delete or prune, required: true }
      payload: { description: JSON with category, text, id, expires_at, source, required: false, default: '{}' }

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply
        env:
          OP: ${{ inputs.op }}
          PAYLOAD: ${{ inputs.payload }}
        run: node src/memory.js "$OP" "$PAYLOAD"
      - name: Save
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add memory
          git diff --cached --quiet || git commit -m "memory: ${{ inputs.op }} [skip ci]"
          git pull --rebase --autostash origin main
          git push
