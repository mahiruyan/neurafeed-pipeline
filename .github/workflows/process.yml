name: Render and queue

on:
  push:
    branches: [main]
    paths: ['jobs/**.json', 'desk/log.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the newest main: a run that waited in the queue must not work from the commit it was
      # started for, or it would act on old state (lost approvals, double posts, failed saves).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1
      - run: npm install --no-audit --no-fund
      - name: Video tools (yt-dlp, ffmpeg)
        run: |
          python3 -m pip install --quiet --upgrade --pre yt-dlp
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          yt-dlp --version && ffmpeg -version | head -1
      - name: Background removal tools (only when a job asks for a cutout)
        id: cut
        run: |
          if grep -rqE '"cutout": *true|"shape": *"free"' jobs; then echo "need=1" >> "$GITHUB_OUTPUT"; fi
      - name: Cache background-removal model
        if: steps.cut.outputs.need == '1'
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2net-v1
      - name: Install rembg
        if: steps.cut.outputs.need == '1'
        run: python3 -m pip install --quiet "rembg[cpu]" pillow
      - run: node src/process.js
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Upload images to the public media repo
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          if [ -z "$MEDIA_REPO_TOKEN" ]; then echo "::warning::MEDIA_REPO_TOKEN missing, images not published"; exit 0; fi
          git clone --depth 1 "https://mahiruyan:${MEDIA_REPO_TOKEN}@github.com/mahiruyan/neurafeed-media.git" media
          # The desk's verified stories as RSS for the website's draft worker (GitHub Pages).
          node src/deskfeed.js media/feed/desk.xml || echo "::warning::desk feed not updated"
          added=0
          for d in out/*/; do
            id=$(basename "$d")
            ls "$d"*.jpg >/dev/null 2>&1 || ls "$d"*.mp4 >/dev/null 2>&1 || continue
            # Always copy, so a re-rendered job replaces its old images.
            mkdir -p "media/$id"
            cp "$d"*.jpg "media/$id/" 2>/dev/null || true
            cp "$d"*.mp4 "media/$id/" 2>/dev/null || true
          done
          cd media
          git add -A
          added=$(git diff --cached --name-only | cut -d/ -f1 | sort -u | wc -l)
          git diff --cached --quiet -- feed || echo "::notice::desk feed updated"
          if [ "$added" -gt 0 ]; then
            git config user.name "neurafeed-bot"
            git config user.email "neurafeed-bot@users.noreply.github.com"
            git commit -q -m "media: $added new or updated folder(s)" && git push -q
          fi
          echo "Published $added new folder(s) to neurafeed-media"
      - name: Publish right away (same rules as the 5-minute poll)
        run: node src/poll.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/mahiruyan/neurafeed-media/main
          PUBLIC_VIDEO_BASE: https://mahiruyan.github.io/neurafeed-media
      - name: Save state and renders
        if: always()
        run: 'scripts/save.sh "pipeline: render jobs" state out inbox jobs'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
