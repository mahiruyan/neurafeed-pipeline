name: Render and send for approval

on:
  push:
    branches: [main]
    paths: ['jobs/**.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1
      - run: npm install --no-audit --no-fund
      - run: node src/process.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state and renders
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add state out
          git diff --cached --quiet || git commit -m "pipeline: render jobs [skip ci]"
          git pull --rebase --autostash origin main
          git push
