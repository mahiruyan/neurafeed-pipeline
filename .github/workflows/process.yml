name: Render and queue

on:
  push:
    branches: [main]
    paths: ['jobs/**.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-v1
      - run: npm install --no-audit --no-fund
      - run: node src/process.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Upload images to the public media repo
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          if [ -z "$MEDIA_REPO_TOKEN" ]; then echo "::warning::MEDIA_REPO_TOKEN missing, images not published"; exit 0; fi
          git clone --depth 1 "https://mahiruyan:${MEDIA_REPO_TOKEN}@github.com/mahiruyan/neurafeed-media.git" media
          added=0
          for d in out/*/; do
            id=$(basename "$d")
            ls "$d"*.jpg >/dev/null 2>&1 || continue
            [ -d "media/$id" ] && continue
            mkdir -p "media/$id" && cp "$d"*.jpg "media/$id/" && added=$((added+1))
          done
          cd media
          if [ "$added" -gt 0 ]; then
            git config user.name "neurafeed-bot"
            git config user.email "neurafeed-bot@users.noreply.github.com"
            git add -A && git commit -q -m "media: $added new carousel(s)" && git push -q
          fi
          echo "Published $added new folder(s) to neurafeed-media"
      - name: Publish right away (same rules as the 5-minute poll)
        run: node src/poll.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE: https://raw.githubusercontent.com/mahiruyan/neurafeed-media/main
      - name: Save state and renders
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add state out
          git diff --cached --quiet || git commit -m "pipeline: render jobs [skip ci]"
          git pull --rebase --autostash origin main
          git push
