name: Deploy Telegram bot

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/deploy-bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check that all keys are in place
        id: check
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.DEEPSEEK_API_KEY }}
          D: ${{ secrets.BOT_GH_TOKEN }}
        run: |
          missing=""
          [ -z "$A" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$B" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$C" ] && missing="$missing DEEPSEEK_API_KEY"
          [ -z "$D" ] && missing="$missing BOT_GH_TOKEN"
          if [ -n "$missing" ]; then echo "::warning::Bot not deployed yet, missing secrets:$missing"; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Webhook secret
        if: steps.check.outputs.ready == 'true'
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: echo "WEBHOOK_SECRET=$(printf '%s' "$T" | sha256sum | cut -c1-48)" >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare Workers
        id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          secrets: |
            TELEGRAM_BOT_TOKEN
            WEBHOOK_SECRET
            DEEPSEEK_API_KEY
            GH_TOKEN
            IG_ACCESS_TOKEN
            IG_USER_ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.BOT_GH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Point Telegram at the bot
        if: steps.check.outputs.ready == 'true'
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "::notice::Worker URL: $URL"
          r=$(curl -s "https://api.telegram.org/bot$T/setWebhook" -d "url=${URL%/}/webhook" -d "secret_token=$WEBHOOK_SECRET" -d 'allowed_updates=["message","callback_query"]')
          echo "::notice::setWebhook: $r"
          echo "$r" | grep -q '"ok":true'
