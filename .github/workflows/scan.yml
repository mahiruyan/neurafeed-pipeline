name: Scan Reddit and news feeds

on:
  schedule:
    # Main trigger: cron-job.org, 12 minutes before each news-desk run. Backup only:
    - cron: '40 1,9,11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/scan.js', '.github/workflows/scan.yml']

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the newest main: a run that waited in the queue must not work from the commit it was
      # started for, or it would act on old state (lost approvals, double posts, failed saves).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/scan.js
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Save leads
        run: 'scripts/save.sh "leads: scan" leads'
