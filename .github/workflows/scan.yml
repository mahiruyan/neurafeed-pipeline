name: Scan Reddit and news feeds

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/scan.js', '.github/workflows/scan.yml']

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/scan.js
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Save leads
        run: |
          git config user.name "neurafeed-bot"
          git config user.email "neurafeed-bot@users.noreply.github.com"
          git add leads
          git diff --cached --quiet || git commit -m "leads: scan [skip ci]"
          git pull --rebase --autostash origin main
          git push
