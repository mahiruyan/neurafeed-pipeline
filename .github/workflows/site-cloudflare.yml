name: Website on Cloudflare

# Builds the NeuraFeed website (mahiruyan/neurafeed) for Cloudflare Workers and deploys it:
#   neurafeed-web   (public site)  and  neurafeed-admin (admin panel + scheduled jobs)
# Settings are copied from the Netlify projects through the Netlify API and stored as Worker
# secrets; no value is printed. The database goes through a Hyperdrive config (neurafeed-db).
# Until cutover=true the admin's scheduled jobs stay disabled here (Netlify still runs them).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "web, admin or both"
        required: true
        default: both
      ref:
        description: "branch of mahiruyan/neurafeed"
        required: true
        default: cloudflare
      cutover:
        description: "true: enable the scheduled jobs on Cloudflare (turn them off on Netlify first)"
        required: true
        default: "false"
      production:
        description: "true: use neurafeedai.com and admin.neurafeedai.com as the site addresses"
        required: true
        default: "true"
      hyperdrive:
        description: "true: connect through Hyperdrive (off: it timed out with the Supabase transaction pooler on 2026-10-28)"
        required: false
        default: "false"

concurrency:
  group: site-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETLIFY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_DATABASE_URL: ${{ secrets.SITE_DATABASE_URL }}
      SITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SITE_SUPABASE_PUBLISHABLE_KEY }}
      SITE_R2_ACCESS_KEY_ID: ${{ secrets.SITE_R2_ACCESS_KEY_ID }}
      SITE_R2_SECRET_ACCESS_KEY: ${{ secrets.SITE_R2_SECRET_ACCESS_KEY }}
      SITE_RESEND_API_KEY: ${{ secrets.SITE_RESEND_API_KEY }}
      SITE_DIGEST_RECIPIENT: ${{ secrets.SITE_DIGEST_RECIPIENT }}
      SITE_DIGEST_FROM: NeuraFeed <desk@neurafeedai.com>
      WORKERS_SUBDOMAIN: mahiruyan956.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mahiruyan/neurafeed
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SECRETS_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund

      # The site must use the limited neurafeed_runtime database login (row security applies, and the
      # scheduled editorial worker refuses any other login). Its password is derived from the stored
      # database secret, set with the owner login, and checked before anything is deployed.
      - name: Runtime database login
        run: |
          node --input-type=module -e '
            import pg from "pg"; import crypto from "node:crypto"; import fs from "node:fs";
            const ownerUrl = process.env.SITE_DATABASE_URL;
            if (!ownerUrl) { console.log("::warning::SITE_DATABASE_URL is empty"); process.exit(0); }
            const owner = new URL(ownerUrl);
            const [role, ref] = decodeURIComponent(owner.username).split(".");
            const out = (url) => fs.appendFileSync(process.env.GITHUB_ENV, `RUNTIME_DATABASE_URL=${url}\n`);
            if (role === "neurafeed_runtime") { out(ownerUrl); console.log("::notice::database secret already uses neurafeed_runtime"); process.exit(0); }
            const password = crypto.createHash("sha256").update(`${ownerUrl}|neurafeed_runtime|v1`).digest("base64url").slice(0, 40);
            console.log(`::add-mask::${password}`);
            const runtime = new URL(ownerUrl);
            runtime.username = encodeURIComponent(`neurafeed_runtime${ref ? "." + ref : ""}`);
            runtime.password = password;
            const plain = (u) => { const x = new URL(u); x.searchParams.delete("sslmode"); return x.toString(); };
            const ssl = { rejectUnauthorized: false };
            const admin = new pg.Client({ connectionString: plain(ownerUrl), ssl });
            await admin.connect();
            await admin.query(`ALTER ROLE neurafeed_runtime WITH LOGIN PASSWORD \x27${password}\x27`);
            const attrs = (await admin.query("SELECT rolsuper, rolbypassrls, rolcanlogin FROM pg_roles WHERE rolname = \x27neurafeed_runtime\x27")).rows[0];
            await admin.end();
            if (!attrs || attrs.rolsuper || attrs.rolbypassrls) { console.log("::error::neurafeed_runtime missing or too powerful: " + JSON.stringify(attrs)); process.exit(1); }
            let who = null;
            for (let i = 0; i < 8 && !who; i++) {
              try { const c = new pg.Client({ connectionString: plain(runtime.toString()), ssl }); await c.connect(); who = (await c.query("SELECT current_user AS u")).rows[0].u; await c.end(); }
              catch (e) { console.log(`runtime login attempt ${i + 1}: ${e.message}`); await new Promise((r) => setTimeout(r, 5000)); }
            }
            if (who !== "neurafeed_runtime") { console.log("::error::could not log in as neurafeed_runtime; the site keeps its current login"); process.exit(1); }
            console.log(`::add-mask::${runtime.toString()}`);
            out(runtime.toString());
            console.log("::notice::site will use the neurafeed_runtime database login");
          '

      - name: Settings from Netlify
        run: |
          api=https://api.netlify.com/api/v1; H="Authorization: Bearer $NETLIFY"
          for pair in web:neurafeed-staging-public admin:neurafeed-staging-admin; do
            app=${pair%%:*}; site=${pair#*:}
            s=$(curl -sf -H "$H" "$api/sites/$site.netlify.app") || { echo "::error::netlify site $site not found"; exit 1; }
            id=$(jq -r .id <<<"$s"); acct=$(jq -r .account_slug <<<"$s")
            curl -sf -H "$H" "$api/accounts/$acct/env?site_id=$id" \
              | jq '[.[] | {key, value: ((.values | map(select(.context=="production")) | .[0].value) // (.values | map(select(.context=="all")) | .[0].value))} | select(.value != null)] | from_entries' > /tmp/env-$app.json
            jq -r '.[]' /tmp/env-$app.json | while IFS= read -r v; do if [ ${#v} -ge 6 ]; then echo "::add-mask::$v"; fi; done
            echo "::notice::$app: $(jq 'length' /tmp/env-$app.json) settings copied ($(jq -r 'keys | join(", ")' /tmp/env-$app.json))"
          done
          # Netlify never returns secret values (it sends the same placeholder for all of them).
          # Drop those and use the real values saved as GitHub secrets (SITE_*); make a fresh job token.
          ph=$(jq -rs '[.[] | to_entries[] | select(.value|length==20) | .value] | group_by(.) | map(select(length>=3)) | .[0][0] // ""' /tmp/env-web.json /tmp/env-admin.json)
          jobtoken=$(openssl rand -hex 32)
          for app in web admin; do
            jq --arg ph "$ph" --arg db "${RUNTIME_DATABASE_URL:-$SITE_DATABASE_URL}" --arg pk "$SITE_SUPABASE_PUBLISHABLE_KEY" --arg r2i "$SITE_R2_ACCESS_KEY_ID" --arg r2s "$SITE_R2_SECRET_ACCESS_KEY" --arg rs "$SITE_RESEND_API_KEY" --arg jt "$jobtoken" --arg dto "$SITE_DIGEST_RECIPIENT" --arg dfrom "$SITE_DIGEST_FROM" --slurpfile adm /tmp/env-admin.json '
              with_entries(select($ph == "" or .value != $ph))
              | if $db != "" then .DATABASE_URL = $db else . end
              | .NEURAFEED_DATABASE_CA_CERT_BASE64 = (.NEURAFEED_DATABASE_CA_CERT_BASE64 // $adm[0].NEURAFEED_DATABASE_CA_CERT_BASE64)
              | if $pk != "" then .NEURAFEED_SUPABASE_PUBLISHABLE_KEY = $pk else . end
              | if $r2i != "" then .NEURAFEED_R2_ACCESS_KEY_ID = $r2i else . end
              | if $r2s != "" then .NEURAFEED_R2_SECRET_ACCESS_KEY = $r2s else . end
              | if $rs != "" and has("RESEND_API_KEY") then .RESEND_API_KEY = $rs else . end
              | if $rs != "" then .NEURAFEED_INQUIRY_EMAIL_KEY = $rs else . end
              | if has("NEURAFEED_EDITORIAL_OWNER_DIGEST_FROM") then .NEURAFEED_EDITORIAL_OWNER_DIGEST_FROM = $dfrom else . end
              | if $dto != "" and has("NEURAFEED_EDITORIAL_OWNER_DIGEST_RECIPIENT") then .NEURAFEED_EDITORIAL_OWNER_DIGEST_RECIPIENT = $dto else . end
              | if has("NEURAFEED_EDITORIAL_JOB_ACTOR_ID") then .NEURAFEED_EDITORIAL_JOB_TOKEN = $jt else . end
              | with_entries(select(.value != null))' /tmp/env-$app.json > /tmp/env-$app.2 && mv /tmp/env-$app.2 /tmp/env-$app.json
            echo "::notice::$app missing after cleanup (add as SITE_* secrets if needed): $(comm -13 <(jq -r 'keys[]' /tmp/env-$app.json | sort) <(printf '%s\n' DATABASE_URL NEURAFEED_SUPABASE_PUBLISHABLE_KEY NEURAFEED_R2_ACCESS_KEY_ID NEURAFEED_R2_SECRET_ACCESS_KEY RESEND_API_KEY NEURAFEED_EDITORIAL_OWNER_DIGEST_FROM NEURAFEED_EDITORIAL_OWNER_DIGEST_RECIPIENT | sort) | tr '\n' ' ')"
          done

      - name: Hyperdrive (database pooling, optional)
        if: inputs.hyperdrive == 'true'
        run: |
          # Optional: without it the Workers connect to DATABASE_URL directly (per-request client).
          set +e +o pipefail
          cf=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs
          list=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf")
          if [ "$(jq -r '.success' <<<"$list")" != "true" ]; then
            echo "::warning::Hyperdrive skipped: $(jq -c '.errors' <<<"$list" | cut -c1-300). The site connects to the database directly."; exit 0
          fi
          id=$(jq -r '.result[]? | select(.name=="neurafeed-db") | .id' <<<"$list" | head -1)
          if [ -z "$id" ]; then
            url=$(jq -r '.DATABASE_URL // empty' /tmp/env-admin.json)
            body=$(node -e '
              const u=new URL(process.argv[1]);
              console.log(JSON.stringify({name:"neurafeed-db",origin:{scheme:"postgres",host:u.hostname,port:Number(u.port||5432),database:decodeURIComponent(u.pathname.slice(1)||"postgres"),user:decodeURIComponent(u.username),password:decodeURIComponent(u.password)},caching:{disabled:true}}));' "$url")
            r=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$cf" -d "$body")
            id=$(jq -r '.result.id // empty' <<<"$r")
            [ -n "$id" ] || { echo "::warning::Hyperdrive create failed: $(jq -c '.errors' <<<"$r" | cut -c1-300). Direct connection instead."; exit 0; }
            echo "::notice::Hyperdrive neurafeed-db created"
          fi
          for app in web admin; do
            node -e '
              const fs=require("fs"),p=process.argv[1];
              let s=fs.readFileSync(p,"utf8");
              s=s.replace(/\n}\s*$/, `,\n  "hyperdrive": [{ "binding": "HYPERDRIVE", "id": "${process.argv[2]}" }]\n}\n`);
              fs.writeFileSync(p,s);' apps/$app/wrangler.jsonc "$id"
          done

      - name: Build and deploy
        run: |
          set -e
          want="${{ inputs.app }}"
          for app in web admin; do
            [ "$want" = both ] || [ "$want" = "$app" ] || continue
            origin="https://neurafeed-$app.$WORKERS_SUBDOMAIN"
            if [ "${{ inputs.production }}" = true ]; then [ $app = web ] && origin=https://neurafeedai.com || origin=https://admin.neurafeedai.com; fi
            # Worker settings: Netlify's, minus Netlify-only keys, with the Workers addresses.
            jq --arg o "$origin" --arg app "$app" --arg cut "${{ inputs.cutover }}" --arg prod "${{ inputs.production }}" '
              del(.NODE_VERSION, .NPM_VERSION, .NETLIFY, .URL)
              | if $app=="web" then .NEURAFEED_PUBLIC_ORIGIN=$o else .NEURAFEED_ADMIN_ORIGIN=$o end
              | if $prod=="true" then .NEURAFEED_PUBLIC_ORIGIN="https://neurafeedai.com" | (if $app=="admin" then .NEURAFEED_ADMIN_ORIGIN="https://admin.neurafeedai.com" else . end) else . end
              | if $prod=="true" and $app=="web" then .NEURAFEED_SEARCH_INDEXING_ENABLED="true" | .NEURAFEED_ALLOWED_SCRIPT_ORIGINS="https://static.cloudflareinsights.com" | .NEURAFEED_ALLOWED_CONNECT_ORIGINS=([.NEURAFEED_ALLOWED_CONNECT_ORIGINS // empty, "https://cloudflareinsights.com"] | map(select(. != "")) | join(",")) else . end
              | if $app=="admin" then .NEURAFEED_DRAFT_TEXT="desk-only" else . end
              | if $app=="web" then .NEURAFEED_OWNER_NAME="Mahir Uyan" | .NEURAFEED_LEGAL_ENTITY_NAME="Mahir Uyan, individual publisher (Türkiye)" | .NEURAFEED_LEGAL_JURISDICTION="Türkiye" | .NEURAFEED_TERMS_EFFECTIVE_DATE="October 28, 2026" | .NEURAFEED_EDITORIAL_EMAIL="hello@neurafeedai.com" | .NEURAFEED_CORRECTIONS_EMAIL="hello@neurafeedai.com" | .NEURAFEED_PRIVACY_EMAIL="hello@neurafeedai.com" | .NEURAFEED_PARTNERSHIPS_EMAIL="hello@neurafeedai.com" else . end
              | if $app=="admin" and $cut!="true" then .NEURAFEED_EDITORIAL_DAILY_SCAN_ENABLED="disabled" | .NEURAFEED_EDITORIAL_OWNER_DIGEST_ENABLED="disabled" else . end
              | with_entries(.value |= tostring)' /tmp/env-$app.json > /tmp/secrets-$app.json
            # Build with the same settings (Next reads some at build time).
            ( set -a; eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value|@sh)"' /tmp/secrets-$app.json)"; set +a
              export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$DATABASE_URL"
              cd apps/$app && npx opennextjs-cloudflare build >/tmp/build-$app.log 2>&1 ) || { tail -40 /tmp/build-$app.log; echo "::error::$app build failed: $(grep -iE 'error|certificate|econn|enotfound|database|fail' /tmp/build-$app.log | grep -v 'npm error\|at \|node:internal' | head -25 | cut -c1-240 | tr '\n' '|')"; exit 1; }
            cd apps/$app
            # Wrangler wants a "local" connection string for the Hyperdrive binding during deploy.
            CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$(jq -r '.DATABASE_URL' /tmp/secrets-$app.json)" npx wrangler deploy --secrets-file /tmp/secrets-$app.json >/tmp/deploy-$app.log 2>&1 || { tail -30 /tmp/deploy-$app.log; echo "::error::$app deploy failed: $(grep -v '^\s*$' /tmp/deploy-$app.log | tail -25 | cut -c1-200 | tr '\n' '|')"; exit 1; }
            cd ../..
            echo "::notice::$app deployed: $origin"
          done
          rm -f /tmp/env-*.json /tmp/secrets-*.json
