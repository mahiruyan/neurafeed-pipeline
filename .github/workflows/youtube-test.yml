name: YouTube download test

# Read-only check: which yt-dlp YouTube clients get past the "confirm you're not a bot" check
# from GitHub's servers, for info, captions and a short section.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube video URL
        default: 'https://www.youtube.com/watch?v=UF8uR6Z6KLc'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tools
        run: |
          python3 -m pip install --quiet --upgrade --pre yt-dlp
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          echo "::notice::yt-dlp $(yt-dlp --version)"
      - name: Try each client
        run: |
          for c in default tv web_safari mweb android_vr ios web_embedded tv_simply; do
            args=(); [ "$c" != default ] && args=(--extractor-args "youtube:player_client=$c")
            if out=$(yt-dlp "${args[@]}" --no-playlist --skip-download --print "%(title)s" "${{ inputs.url }}" 2>err.txt); then info="info ok"; else info="info FAIL: $(grep -o 'ERROR.*' err.txt | cut -c1-90)"; fi
            rm -f s*.vtt; yt-dlp "${args[@]}" --no-playlist --skip-download --write-auto-subs --sub-langs "en.*,en" --sub-format vtt -o s "${{ inputs.url }}" >/dev/null 2>&1
            subs=$(ls s*.vtt 2>/dev/null | head -1); [ -n "$subs" ] && subs="captions ok" || subs="captions FAIL"
            rm -f sec.*; if yt-dlp "${args[@]}" --no-playlist --download-sections "*00:01:00-00:01:10" -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 -o "sec.%(ext)s" "${{ inputs.url }}" >/dev/null 2>&1; then sec="section ok"; else sec="section FAIL"; fi
            echo "::notice::$c: $info | $subs | $sec"
          done
