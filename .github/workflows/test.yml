name: Tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'bot/**', 'test/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/*.test.js
      - name: Workflow files are valid YAML
        run: for f in .github/workflows/*.yml; do python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" || exit 1; done
