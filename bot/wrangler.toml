name = "neurafeed-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
OWNER_CHAT_ID = "962175935"
REPO = "mahiruyan/neurafeed-pipeline"
DEEPSEEK_MODEL = "deepseek-v4-pro"
SITE_ADMIN_ORIGIN = "https://neurafeed-staging-admin.netlify.app"
# The instant link task (Claude scheduled task with an API trigger); token is the LINK_ROUTINE_TOKEN secret.
LINK_ROUTINE_URL = "https://api.anthropic.com/v1/claude_code/routines/trig_01AjA44Z4u81PZhA9N7NQzNN/fire"

[triggers]
crons = ["*/5 * * * *", "0 17 * * SUN", "0 7 * * MON", "0 7 1 * *"]

# Filled in by the deploy workflow (it creates the namespace on the first run).
[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

# Background queue for Telegram messages (answers Telegram at once, works up to 15 minutes).
[[durable_objects.bindings]]
name = "RUNNER"
class_name = "Runner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Runner"]
