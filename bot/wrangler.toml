name = "neurafeed-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
OWNER_CHAT_ID = "962175935"
REPO = "mahiruyan/neurafeed-pipeline"
DEEPSEEK_MODEL = "deepseek-v4-pro"

[triggers]
crons = ["*/5 * * * *", "0 17 * * SUN", "0 7 * * MON", "0 7 1 * *"]

# Filled in by the deploy workflow (it creates the namespace on the first run).
[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"
